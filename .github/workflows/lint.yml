name: Build Obsidian Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install # Bruker "install" i stedet for "ci" for å unngå strenge lock-feil

    - name: Build plugin
      run: npm run build # Dette genererer main.js og manifest.json

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: obsidian-plugin
        path: |
          main.js
          manifest.json
          styles.css
